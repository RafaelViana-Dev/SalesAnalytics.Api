<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Vendas - Analytics API</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 30px;
        }

        .header {
            margin-bottom: 30px;
        }

            .header h1 {
                font-size: 28px;
                color: #1a202c;
            }

            .header p {
                color: #718096;
                font-size: 14px;
            }

        /* Grid dos KPIs */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border-left: 5px solid #3182ce;
        }

            .card h3 {
                font-size: 14px;
                text-transform: uppercase;
                color: #a0aec0;
                margin-bottom: 10px;
            }

            .card .value {
                font-size: 26px;
                font-weight: bold;
                color: #2d3748;
            }

        /* Container do Gráfico */
        .chart-container {
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            max-width: 600px;
            margin: 0 auto;
        }

            .chart-container h2 {
                font-size: 18px;
                margin-bottom: 20px;
                color: #2d3748;
                text-align: center;
            }
    </style>
</head>
<body>

    <div class="header">
        <h1>📊 Executive Sales Analytics</h1>
        <p>Dados consumidos em tempo real da API C# ASP.NET Core</p>
    </div>

    <!-- Seção de KPIs -->
    <div class="kpi-grid">
        <div class="card" style="border-color: #38a169;">
            <h3>Faturamento Total</h3>
            <div class="value" id="total-revenue">R$ 0,00</div>
        </div>
        <div class="card" style="border-color: #3182ce;">
            <h3>Total de Pedidos</h3>
            <div class="value" id="total-orders">0</div>
        </div>
        <div class="card" style="border-color: #805ad5;">
            <h3>Ticket Médio</h3>
            <div class="value" id="avg-ticket">R$ 0,00</div>
        </div>
    </div>

    <!-- Seção do Gráfico -->
    <div class="chart-container">
        <h2>Vendas por Categoria (%)</h2>
        <canvas id="categoryChart"></canvas>
    </div>

    <script>
        // Altere a porta abaixo se a sua API estiver usando outra porta diferente de 5194
        const API_BASE_URL = 'http://localhost:5194/api/analytics';

        // Formatador de Moeda BRL
        const formatCurrency = (value) => {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
        };

        // 1. Buscar Dados do Resumo (Summary)
        async function fetchSummary() {
            try {
                const response = await fetch(`${API_BASE_URL}/summary`);
                const data = await response.json();

                document.getElementById('total-revenue').innerText = formatCurrency(data.totalRevenue);
                document.getElementById('total-orders').innerText = data.totalOrders;
                document.getElementById('avg-ticket').innerText = formatCurrency(data.averageTicket);
            } catch (error) {
                console.error('Erro ao buscar o resumo de vendas:', error);
            }
        }

        // 2. Buscar Dados de Vendas por Categoria e Renderizar Gráfico
        async function fetchCategorySales() {
            try {
                const response = await fetch(`${API_BASE_URL}/by-category`);
                const data = await response.json();

                const labels = data.map(item => item.category);
                const values = data.map(item => item.totalAmount);

                renderChart(labels, values);
            } catch (error) {
                console.error('Erro ao buscar vendas por categoria:', error);
            }
        }

        // 3. Função para Renderizar o Chart.js
        function renderChart(labels, dataValues) {
            const ctx = document.getElementById('categoryChart').getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: dataValues,
                        backgroundColor: ['#34C759', '#007AFF', '#FF3B30', '#00CED1', '#e53e3e'],
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });
        }

        // Inicializar chamadas ao carregar a página
        fetchSummary();
        fetchCategorySales();
    </script>
</body>
</html>
